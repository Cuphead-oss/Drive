{% extends 'Drive/base.html' %}
{% load static %}
  
{% block head %}
<link href="{% static 'Main/Main.css' %}" rel="stylesheet" >
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}

{% block body %}
<div class="row">
{% if Files %}    
{% for file in Files %}
<div class="col-lg-3 col-md-4 col-sm-6 mb-3">
  <div class="card h-100">

    <img class="card-img-top"
         src="{{ file.image.url }}"  height="250"
         alt="Pdf">


    <div class="card-body">
      <h6 class="card-title">Upoladed At : {{ file.date }}</h6>

      <a href="{% url 'Download' file.id %}" class="btn btn-primary">Download</a>

      <a href="{% url 'Del_File' file.id id %}"
         class="btn btn-primary"
         style="color: red;">
        Remove
      </a>
    </div>

  </div>
</div>
{% endfor %}
{% else %}
<p>Nothing Found</p>
{% endif %} 


</div>
{% endblock %}
