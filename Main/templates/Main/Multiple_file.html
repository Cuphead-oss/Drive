{% extends 'Drive/base.html' %}

{% load static %}

{% block head %}
<link   href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" 
rel="stylesheet" 
integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" 
crossorigin="anonymous">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style type="text/css">
.container{
margin-top: 20rem;
}
</style>

<link href="{% static 'Main/Main.css' %}" rel="stylesheet" >
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}

{% block body %}
<script>
      $(document).ready(function() {
    $("#storage_full").fadeOut(6000);
});   
</script>

<div class="container center">
    <form method="post" enctype="multipart/form-data" action="{% url 'Multiple_upload' id %}">
        {% csrf_token %}
        <div class="mb-3">
          <label for="formFile" class="form-label">Upload Files Here</label>
          {{form}}
        </div>
        <button type="submit" class="btn btn-outline-primary ">Submit</button>
    </form>
</div>

{% if messages %}
{% for message in messages %}
{% if message.tags == "Storage_full" %}
  <div class="col-md-12 text-center mb-3" id="storage_full">
      {{ message }}
  </div>
{% endif %}
{% endfor %}
{% endif %}

{% endblock %}
