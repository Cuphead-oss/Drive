<!DOCTYPE html>
<html lang="en">
<head>
    <link href="//maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">
<script src="//maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<!------ Include the above in your HEAD tag ---------->

<script src="https://cdn.jsdelivr.net/jquery.validation/1.15.1/jquery.validate.min.js"></script>
<link href="https://fonts.googleapis.com/css?family=Kaushan+Script" rel="stylesheet">
<link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN" crossorigin="anonymous">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script>
    $(document).ready(function() {
    $("#userpass").fadeOut(6000);
}); 
</script>
    <div class="container">
    <div class="row">
        <div class="col-md-5 mx-auto">
          <div id="second">
              <div class="myform form ">
                    <div class="logo mb-3">
                       <div class="col-md-12 text-center">
                          <h1 >Reset Password</h1>
                       </div>
                    </div>
                    <form action="{% url 'reset' uid token %}" method="post" name="registration"> {% csrf_token %}
                       <div class="form-group">
                          
                          <input type="password"  name="New_Pass" class="form-control" id="firstname" aria-describedby="emailHelp" placeholder="Reset Password">
                    </div>
                    <div class="col-md-12 text-center mb-3">
                        <button type="submit" class=" btn btn-block mybtn btn-primary tx-tfm">Submit</button>
                     </div>
                          </div>
                       </div>
                        </div>
                    </form>
                 </div>
        </div>
    </div>
  </div>  

{% if messages %}
{% for message in messages %}
    {% if  message.tags == "ResetUser_Password" %}
    <div class="col-md-12 text-center mb-3" id="userpass">
    <p>{{message}}</p>
    </div>
    {% endif %}
{% endfor %}
{% endif %} 

</body>
</html>
